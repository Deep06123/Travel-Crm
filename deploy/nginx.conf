# nginx site for the Travel Booking CRM on a Hostinger VPS.
#
# Install with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/travel-crm
#   sudo ln -s /etc/nginx/sites-available/travel-crm /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # Hostinger's placeholder
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a certificate. certbot rewrites this file in place, adding the
# 443 server block, the certificate paths and the HTTP→HTTPS redirect:
#   sudo certbot --nginx -d crm.example.com
#
# Replace crm.example.com throughout before installing.

upstream travel_crm {
    # Must match PORT/HOSTNAME in deploy/travel-crm.service.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # Documents are capped at 25 MB by the application and by the Server Action
    # body limit in next.config.ts. All three have to agree: nginx's own 1 MB
    # default rejects the upload with a 413 the application never sees, so the
    # form shows a network error instead of "file is too large".
    client_max_body_size 25m;
    client_body_timeout 120s;

    # Reports run several aggregate queries in parallel and are the slowest
    # thing here. 60s is comfortably above them and well under a user's
    # patience; the default 60s read timeout is kept explicit so it is a
    # decision rather than an accident.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Next sets its own Cache-Control per route and every page is
    # per-administrator. Nothing is cached here.
    proxy_buffering off;

    # Immutable build assets: the filename contains a content hash, so a stale
    # copy is impossible and revalidation is pure overhead.
    location /_next/static/ {
        proxy_pass http://travel_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Readiness probe. Logged separately so an uptime monitor hitting it every
    # thirty seconds does not bury the real access log.
    location = /api/health {
        access_log off;
        proxy_pass http://travel_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://travel_crm;
        proxy_http_version 1.1;

        # $host, not $http_host: Next compares a Server Action's Origin header
        # against the Host it was given, and rejects the action when they
        # disagree. Forwarding the client's own Host keeps them matched.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # --- After certbot has run -------------------------------------------
    # Add this to the 443 block it creates. HSTS belongs at the terminator,
    # not in next.config.ts, so local HTTP development is unaffected:
    #
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy and
    # Permissions-Policy are already set by the application itself.
}
